services:
  mysql:
    image: mysql:8.4
    container_name: feedwise-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: feedwise
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    ports:
      - "3310:3306"   # 宿主机 3310，避开本机原生 MySQL(3306) 与残留代理
    volumes:
      - ./src/main/resources/Sql:/docker-entrypoint-initdb.d:ro
      - feedwise-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: feedwise-redis
    ports:
      - "6381:6379"   # 宿主机 6381，避开 cache-kit-redis(6379) 与残留代理

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: feedwise-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"   # 管理界面 guest/guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  feedwise-mysql-data:
