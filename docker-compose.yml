services:
  mysql:
    image: mysql:8.4
    container_name: feedwise-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: feedwise
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./src/main/resources/Sql:/docker-entrypoint-initdb.d:ro
      - feedwise-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: feedwise-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: feedwise-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"   # 管理界面 guest/guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  feedwise-mysql-data:
