spring:
  application:
    name: feedwise
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3310}/${DB_NAME:feedwise}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6381}
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USERNAME:guest}
    password: ${RABBIT_PASSWORD:guest}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

# ── auth-kit：不透明 token + Redis 会话；同端顶号；白名单放行登录与治理端点 ──
auth-kit:
  token:
    timeout: 7d
    active-timeout: 1d
  session:
    max-sessions-per-device: 1
  # 管理端点：在线会话查询/强制下线（PM 演示用，静态令牌保护）
  management:
    enabled: true
    auth-token: ${AUTH_MGMT_TOKEN:feedwise-mgmt}
  whitelist:
    - /api/auth/login
    - /api/internal/governance-alert
    - /web-common/error-codes
    - /api-governance/**
    - /actuator/**

# ── api-governance：接口治理 ──
api:
  governance:
    enabled: true
    log:
      slow-threshold-ms: 500
    rate-limit:
      type: local
      algorithm: token-bucket
      default-limit: -1          # 默认不限，注解按需收紧
      status-code: 429
      message: 请求过于频繁，请稍后再试
    metrics:
      micrometer-enabled: true
    management:
      enabled: true
      auth-token: ${GOV_MGMT_TOKEN:feedwise-gov}
      base-path: /api-governance
    alert:
      enabled: true
      suppress-interval-ms: 5000
      webhook:
        url: http://localhost:${SERVER_PORT:8080}/api/internal/governance-alert
        auth-token: ${GOV_ALERT_TOKEN:feedwise-alert}
        auth-header: X-Alert-Token

# ── concurrent-guard：幂等 + 分布式锁 ──
guard:
  enabled: true
  idempotent:
    # REPLAY 完成哨兵宽限：业务耗时略超占位 TTL 时重复请求仍可重放上次结果
    replay-grace-millis: 5000

# ── data-scope：行级数据权限（开启即强承诺，必须配 ScopeResolver）──
data-scope:
  enabled: true

# ── state-kit：三台状态机 + 流转历史 + 冲突自动重试 ──
state-kit:
  operator: auto
  history:
    enabled: true
  retry:
    max-attempts: 3
    backoff-ms: 50
  machines:
    task:
      state-type: com.feedwise.enums.TaskStatus
      table: improvement_task
      status-column: status
      id-column: id
      id-type: java.lang.Long
      conflict-strategy: throw
      transitions:
        - { from: TODO, event: START, to: IN_PROGRESS }
        - { from: IN_PROGRESS, event: SUBMIT, to: PENDING_VERIFY }
        - { from: PENDING_VERIFY, event: PASS, to: DONE, guard: verifyResultGuard, action: taskPassAction }
        - { from: PENDING_VERIFY, event: REJECT, to: IN_PROGRESS, guard: verifyResultGuard }
    issue:
      state-type: com.feedwise.enums.IssueStatus
      table: candidate_issue
      status-column: status
      id-column: id
      id-type: java.lang.Long
      conflict-strategy: throw
      transitions:
        - { from: PENDING_REVIEW, event: CONFIRM, to: CONFIRMED }
        - { from: PENDING_REVIEW, event: REJECT, to: REJECTED }
        - { from: PENDING_REVIEW, event: MERGE, to: MERGED }
    draft:
      state-type: com.feedwise.enums.DraftStatus
      table: requirement_draft
      status-column: status
      id-column: id
      id-type: java.lang.Long
      conflict-strategy: throw
      transitions:
        - { from: DRAFT, event: CONFIRM, to: CONFIRMED }
        - { from: CONFIRMED, event: CONVERT, to: CONVERTED }

# ── cache-kit binlog 直连失效：兜底一切"绕过 MyBatis-Plus 的写"——
#    包括 state-kit 状态机 CAS 直写、DBA 手工改库，COMMIT 后自动失效对应实体缓存 ──
cache-kit:
  binlog:
    enabled: true
    gtid-enabled: true
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:3310}
    database: ${DB_NAME:feedwise}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

# ── OutboxPro：批量导入事务事件 → RabbitMQ → AI 整理消费者 ──
outboxpro:
  enabled: true
  producer-name: feedwise
  schema-initialize: true
  producer:
    relay-enabled: true
    batch-size: 100
    poll-interval: 1s
  consumer:
    enabled: true
    concurrency: 2
  ops:
    enabled: true
  dlq:
    ledger:
      enabled: true
      schema-initialize: true
      max-replay-count: 3
    replay:
      enabled: true   # 配合 DlqReplayAuthorizer 按 scope 判权（仅 PM 可重放）

feedwise:
  ai:
    provider: mock               # mock=离线确定性引擎；openai=OpenAI 兼容 function calling
    base-url: ${AI_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:glm-4-flash}
    timeout-ms: 20000
    max-tool-calls: 20

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.feedwise: info
